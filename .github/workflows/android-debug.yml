# Builds the Android debug APK in the cloud, so no local Android Studio is needed.
# One-time setup: add a repository secret named GOOGLE_SERVICES_JSON_BASE64
# (the base64 of android/app/google-services.json), then run this workflow from the Actions tab.
name: Android debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Add google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "Secret GOOGLE_SERVICES_JSON_BASE64 is missing"; exit 1; }
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vaultlens-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
